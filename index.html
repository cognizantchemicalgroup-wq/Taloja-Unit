<style>
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;background:#faf9f6;background-attachment:fixed;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;color:#1c1917;padding:52px 20px 40px;}
.wrap{display:flex;flex-direction:column;align-items:center;}
.profile{display:flex;flex-direction:column;align-items:center;text-align:center;}
.av{width:100px;height:100px;border-radius:50%;object-fit:cover;border:3px solid rgba(255,255,255,.35);box-shadow:0 6px 24px rgba(0,0,0,.2);}
.av-ph{width:100px;height:100px;border-radius:50%;background:rgba(127,127,127,.25);display:grid;place-items:center;font-size:40px;}
h1{font-size:23px;font-weight:800;margin-top:16px;letter-spacing:-.01em;}
.bio{font-size:14.5px;color:#78716c;margin-top:7px;max-width:360px;line-height:1.55;}
.socs{display:flex;gap:14px;margin-top:15px;font-size:22px;flex-wrap:wrap;justify-content:center;}
.soc{text-decoration:none;transition:transform .15s;}
.soc:hover{transform:scale(1.2);}
.links{width:100%;max-width:500px;margin-top:30px;display:flex;flex-direction:column;gap:13px;}
.sec{font-size:12.5px;font-weight:800;text-transform:uppercase;letter-spacing:.12em;color:#78716c;margin:16px 4px 0;}
.lnk,.card{background:#ffffff;color:#1c1917;border:1px solid #e7e5e4;border-radius:10px;box-shadow:4px 4px 0 rgba(0,0,0,.35);backdrop-filter:blur(6px);}
.lnk{display:flex;align-items:center;gap:14px;padding:13px 16px;text-decoration:none;transition:transform .15s;}
.lnk:hover{transform:translateY(-2px) scale(1.01);}
.lnk:active{transform:scale(.985);}
.lg{width:40px;height:40px;border-radius:9px;object-fit:cover;flex-shrink:0;background:rgba(127,127,127,.15);}
.lg.emo{display:grid;place-items:center;font-size:20px;}
.tcol{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;}
.tt{font-weight:700;font-size:15px;overflow:hidden;text-overflow:ellipsis;}
.dsc{font-size:12.5px;color:#78716c;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.ar{opacity:.5;font-size:19px;}
.card.loc{padding:16px 18px;}
.loc-head{display:flex;align-items:center;gap:13px;}
.addr{font-size:13.5px;color:#78716c;line-height:1.6;margin:10px 2px 0;padding-left:53px;}
.dir{display:inline-block;margin:12px 0 2px 53px;padding:8px 16px;border-radius:999px;background:#b45309;color:#111;font-weight:800;font-size:13px;text-decoration:none;transition:transform .15s;}
.dir:hover{transform:scale(1.05);}
.foot{margin-top:44px;text-align:center;font-size:11.5px;color:#78716c;opacity:.75;}
@media(min-width:900px){
  body{padding:72px 48px 56px;display:flex;justify-content:center;}
  .wrap{flex-direction:row;align-items:flex-start;gap:72px;max-width:1020px;width:100%;}
  .profile{flex:0 0 320px;position:sticky;top:72px;align-items:flex-start;text-align:left;}
  .bio{max-width:none;}
  .socs{justify-content:flex-start;}
  .links{margin-top:0;flex:1;max-width:none;}
  .sec:first-child{margin-top:0;}
  .foot{position:fixed;bottom:20px;left:0;right:0;}
}
@media(max-width:899px){
  .addr,.dir{padding-left:0;margin-left:0;}
  .addr{text-align:left;}
  .card.loc .addr{padding-left:53px;}
  .card.loc .dir{margin-left:53px;}
}
</style></head><body>
