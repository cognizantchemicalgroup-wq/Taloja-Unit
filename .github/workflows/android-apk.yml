name: Build Android APK

on:
  push:
    paths:
      - 'android-app/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Build APK
        run: ./gradlew --no-daemon assembleRelease

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk 52-weeks.apk

      - uses: actions/upload-artifact@v4
        with:
          name: 52-weeks-apk
          path: android-app/52-weeks.apk

      - name: Save APK to the repo (apk/52-weeks.apk)
        working-directory: .
        run: |
          mkdir -p apk
          cp android-app/52-weeks.apk apk/52-weeks.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apk/52-weeks.apk
          git commit -m "Update built APK" || echo "No change"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
